services:
  - type: keyvalue
    name: taskflow-redis
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

  - type: web
    name: taskflow-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          name: taskflow-redis
          type: keyvalue
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          name: taskflow-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TASKFLOW_ADMIN_USER_IDS
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: AI_TEXT_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: AI_GENERATION_TIMEOUT_MS
        value: "15000"
      - key: AI_INPUT_USD_PER_MILLION
        value: "0.30"
      - key: AI_OUTPUT_USD_PER_MILLION
        value: "2.50"
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SENTRY_TEST_ENABLED
        value: 'false'
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: '0'

  - type: web
    name: taskflow-frontend
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeployTrigger: checksPass
    healthCheckPath: /auth/login
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: taskflow-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
